name: favor_ledger
description: "人情记 - 人情往来账本"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  drift: ^2.28.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  lpinyin: ^2.0.3
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  webdav_client: ^1.2.2
  http: ^1.5.0
  collection: ^1.19.1
  share_plus: ^11.1.0
  google_fonts: ^6.3.2
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#1F6F5B"
  adaptive_icon_foreground: assets/branding/app_icon.png
  min_sdk_android: 21
